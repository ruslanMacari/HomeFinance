services:
  postgres:
    image: postgres:15
    container_name: homeFinance-postgres
    environment:
      POSTGRES_DB: homeFinance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    container_name: homeFinance-app
    ports:
      - "5050:8080"
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://postgres:5432/homeFinance
    depends_on:
      - postgres

volumes:
  postgres-data: